<section>
<perch:form id="input_settings" app="wheeliams" method="post" class="flow">

	<header>
		<h2>Email Template</h2>
	</header>
	
	<article>
		<div>
			<perch:label for="name">Name</perch:label>
			<perch:input type="text" id="name" />
		</div>
		<div>
			<perch:label for="to">To</perch:label>
			<perch:input type="text" id="to" />
		</div>
		<div>
			<perch:label for="cc">Cc</perch:label>
			<perch:input type="text" id="cc" />
		</div>
		<div>
			<perch:label for="subject">Subject</perch:label>
			<perch:input type="text" id="subject" />
		</div>
		<div>
			<perch:label for="content">Content</perch:label>
			<perch:input type="textarea" class="redactor" id="content" />
		</div>
		
		<perch:success>
			<p class="alert success">Success | <a href="/settings/input-parameters/?type=<perch:forms id="type" />">Enter Next Parameter</a> | <a href="/settings/input-parameters/">Exit to Parameters List</a></p>
		</perch:success>
	</article>
	
	<footer>
		<perch:input type="submit" value="Save" class="button primary" />
	</footer>
	
	<perch:input type="hidden" id="wheeliams_settings_inputID" />
	<perch:input type="hidden" id="type" />
	
</perch:form>
</section>
