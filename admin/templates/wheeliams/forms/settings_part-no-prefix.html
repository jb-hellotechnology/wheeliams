<section>
<perch:form id="input_settings" app="wheeliams" method="post" class="flow">

	<header>
		<h2>Part No. Prefix</h2>
	</header>
	
	<article>
		<div>
			<perch:label for="prefix">Prefix</perch:label>
			<perch:input type="text" id="prefix" maxlength="3" class="uppercase" oninput="lettersOnly(this)" />
		</div>
		<div>
			<perch:label for="description">Description</perch:label>
			<perch:input type="text" id="description" />
		</div>
		
		<perch:success>
			<p class="alert success">Success | <a href="/settings/input-parameters/?type=<perch:forms id="type" />">Enter Next Parameter</a> | <a href="/settings/input-parameters/">Exit to Parameters List</a></p>
		</perch:success>
	</article>
	
	<footer>
		<perch:input type="submit" value="Save" class="button primary" />
	</footer>
	
	<perch:input type="hidden" id="wheeliams_settings_inputID" />
	<perch:input type="hidden" id="type" />
	
</perch:form>
</section>

<script>
	$('#form1_prefix').change(function(){
		$(this).val($(this).val().replace(/[^a-zA-Z]/g, ''));
	})
</script>
